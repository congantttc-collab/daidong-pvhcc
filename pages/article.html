<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bài viết</title>

<link rel="stylesheet" href="../css/style.css">

<style>
body{margin:0;background:#eef1f5;font-family:Arial}
.top{background:#c40000;padding:14px 0}
.wrap{width:min(920px,94%);margin:auto}
.brand{display:flex;align-items:center;gap:12px;color:#fff}
.logo{width:56px;height:56px;border-radius:50%}
.brand h2{margin:0;color:#ffd400}
.brand p{margin:2px 0 0;font-size:13px}
.article{background:#fff;margin:28px auto;padding:36px;border-radius:16px;box-shadow:0 6px 20px rgba(0,0,0,.08)}
.bread{font-size:13px;color:#777;margin-bottom:12px}
.tag{display:inline-block;background:#e60000;color:#fff;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:bold}
h1{font-size:42px;line-height:1.2;color:#0d2147;margin:14px 0}
.meta{color:#777;font-size:14px;margin-bottom:18px}
.sum{background:#fff5f5;border-left:4px solid #e60000;padding:16px;border-radius:8px;font-size:18px;margin-bottom:22px}
.hero{width:100%;border-radius:14px;display:block;margin-bottom:24px}
#content p{font-size:20px;line-height:1.9;text-align:justify;margin:0 0 18px}
.share{margin-top:28px;padding-top:20px;border-top:1px solid #ddd}
.btn{display:inline-block;padding:10px 18px;border-radius:8px;text-decoration:none;color:#fff;font-weight:bold;margin-right:8px}
.fb{background:#1877F2}.zl{background:#0068FF}.home{background:#555}
</style>
</head>

<body>

<div class="top">
  <div class="wrap brand">
    <img src="../assets/logo.png" class="logo">
    <div>
      <h2>TRUNG TÂM PVHCC XÃ ĐẠI ĐỒNG</h2>
      <p>Phục vụ Nhân dân tận tâm • Chuyên nghiệp</p>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="article" id="app">Đang tải...</div>
</div>

<script>
const API="https://script.google.com/macros/s/AKfycbygLfolmilb0eD-sfgT4vshz9IXI65DUHhh7-Uw_hkcYVKC7tD_beGoipCLZSD-jYDlbg/exec";
const id=new URLSearchParams(location.search).get("id");

fetch(API+"?api=news")
.then(r=>r.json())
.then(list=>{
 const n=list.find(x=>x.id==id)||list[0];

 document.getElementById("app").innerHTML=`
 <div class="bread">Trang chủ / Tin tức / Hoạt động</div>

 <span class="tag">HOẠT ĐỘNG</span>

 <h1>${n.tieude}</h1>

 <div class="meta">🗓 ${n.ngay} • Trung tâm PVHCC xã Đại Đồng</div>

 <div class="sum">${n.tomtat}</div>

 <img class="hero" src="${n.anh}">

 <div id="content">
 ${n.noidung.split('\n').filter(x=>x.trim()).map(x=>`<p>${x}</p>`).join('')}
 </div>

 <div class="share">
   <a class="btn fb" target="_blank" href="https://www.facebook.com/sharer/sharer.php?u=${location.href}">Facebook</a>
   <a class="btn zl" target="_blank" href="https://zalo.me/share?url=${location.href}">Zalo</a>
   <a class="btn home" href="../index.html">Trang chủ</a>
 </div>`;
});
</script>

</body>
</html>
